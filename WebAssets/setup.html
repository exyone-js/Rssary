<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rssary — Setup</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
body { background-color: #f8f9fa; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
.setup-card { max-width: 480px; width: 100%; margin: 2rem 1rem; }
    </style>
</head>
<body>
    <div class="setup-card">
        <div class="card" id="setupCard">
            <div class="card-body text-center pt-4 pb-2">
                <img src="/favicon.ico" alt="Rssary" width="48" height="48" class="mb-2">
                <h4>Welcome to Rssary</h4>
                <p class="text-muted small">First-time setup</p>
            </div>
            <div class="card-body pt-0">
                <div id="msg" class="alert d-none"></div>

                <form id="setupForm">
                    <div class="mb-3">
                        <label class="form-label" for="siteLanguage">Site Language</label>
                        <select class="form-select" id="siteLanguage" style="max-width:200px;">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="siteTitle">Site Title</label>
                        <input type="text" class="form-control" id="siteTitle" value="Rssary" maxlength="64">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="siteDescription">Site Description</label>
                        <input type="text" class="form-control" id="siteDescription" value="RSS/Feed Aggregator" maxlength="200">
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="reviewKey">Admin Key <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="reviewKey" required minlength="6"
                               placeholder="At least 6 characters" autocomplete="off">
                        <div class="form-text">Used to access the admin panel.</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                        Initialize Rssary
                    </button>
                </form>
            </div>
        </div>

        <div id="successCard" class="card d-none mt-3">
            <div class="card-body text-center py-4">
                <h5 class="text-success mb-3">&#10003; Setup Complete</h5>
                <p class="text-muted small mb-3">Rssary has been initialized.</p>
                <a href="/" class="btn btn-primary">Go to Rssary</a>
            </div>
        </div>
    </div>

    <script>
        async function loadLanguages() {
            const sel = document.getElementById('siteLanguage');
            try {
                const res = await fetch('/api/i18n/languages');
                if (res.ok) {
                    const langs = await res.json();
                    sel.innerHTML = '';
                    langs.forEach(l => {
                        const opt = document.createElement('option');
                        opt.value = l.code;
                        opt.textContent = l.displayName || l.code;
                        if (l.code === 'en-US') opt.selected = true;
                        sel.appendChild(opt);
                    });
                }
            } catch (e) {
                sel.innerHTML = '<option value="en-US">English</option><option value="zh-CN">中文</option>';
            }
        }
        loadLanguages();

        document.getElementById('setupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('msg');

            btn.disabled = true;
            btn.textContent = 'Initializing...';
            msg.classList.add('d-none');

            try {
                const res = await fetch('/api/setup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        reviewKey: document.getElementById('reviewKey').value.trim(),
                        siteTitle: document.getElementById('siteTitle').value.trim() || 'Rssary',
                        siteDescription: document.getElementById('siteDescription').value.trim() || 'RSS/Feed Aggregator',
                        siteLanguage: document.getElementById('siteLanguage').value
                    })
                });

                const data = await res.json();
                if (res.ok) {
                    document.getElementById('setupCard').classList.add('d-none');
                    document.getElementById('successCard').classList.remove('d-none');
                    setTimeout(() => { window.location.href = '/'; }, 1500);
                } else {
                    msg.textContent = data.error || 'Setup failed';
                    msg.className = 'alert alert-danger';
                    msg.classList.remove('d-none');
                    btn.disabled = false;
                    btn.textContent = 'Initialize Rssary';
                }
            } catch (err) {
                msg.textContent = 'Connection failed: ' + err.message;
                msg.className = 'alert alert-danger';
                msg.classList.remove('d-none');
                btn.disabled = false;
                btn.textContent = 'Initialize Rssary';
            }
        });
    </script>
</body>
</html>
