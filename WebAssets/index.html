<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="site-title">Rssary</title>
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
body { background-color: #fff; }
.navbar-brand img { border-radius: 2px; }
.article-item + .article-item { border-top: 1px solid rgba(0,0,0,.05); }
.article-title { font-size: 1rem; font-weight: 600; }
.article-title a { color: #1a1a2e; text-decoration: none; }
.article-title a:hover { color: #0d6efd; }
.article-meta { font-size: .8125rem; color: #6c757d; }
.article-meta a { color: #6c757d; text-decoration: none; }
.article-meta a:hover { color: #0d6efd; text-decoration: underline; }
.stat-number { font-size: 1.75rem; font-weight: 600; line-height: 1.2; }
.stat-label { font-size: .8125rem; color: #6c757d; }
.blog-avatar { width: 48px; height: 48px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; font-size: 1.25rem; font-weight: 700; color: #fff; flex-shrink: 0; }
    </style>
    <div id="head-injection"></div>
</head>
<body>
    <div id="body-start-injection"></div>

    <div id="app">
        <nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top">
            <div class="container">
                <router-link class="navbar-brand d-flex align-items-center gap-2" to="/">
                    <img src="/favicon.ico" alt="Rssary" width="24" height="24">
                    <strong>Rssary</strong>
                </router-link>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <router-link class="nav-link" to="/">{{ t('nav.home') }}</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link class="nav-link" to="/submit">{{ t('nav.submit') }}</router-link>
                        </li>
                        <li class="nav-item">
                            <router-link class="nav-link" to="/admin">{{ t('nav.admin') }}</router-link>
                        </li>
                    </ul>
                    <ul class="navbar-nav">
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                                {{ langDisplayName }}
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li v-for="l in availableLangs" :key="l.code">
                                    <a class="dropdown-item" :class="{ active: lang === l.code }"
                                       @click.prevent="setLang(l.code)">{{ l.displayName }}</a>
                                </li>
                            </ul>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/api" target="_blank">API</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/feed" target="_blank" title="RSS Feed">
                                <svg width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
                                    <path d="M2 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2H2zm1.5 2.5c5.523 0 10 4.477 10 10a1 1 0 1 1-2 0 8 8 0 0 0-8-8 1 1 0 0 1 0-2zm0 4a6 6 0 0 1 6 6 1 1 0 1 1-2 0 4 4 0 0 0-4-4 1 1 0 0 1 0-2zm.5 7a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3z"/>
                                </svg>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container py-4">
            <router-view></router-view>
        </div>

        <footer class="border-top text-muted py-4 mt-4">
            <div class="container text-center small">
                <div class="d-flex justify-content-center align-items-center gap-3 mb-2">
                    <a href="/api" target="_blank" class="text-decoration-none">API</a>
                    <span>|</span>
                    <a href="/feed" target="_blank" class="text-decoration-none">{{ t('nav.rss') }}</a>
                    <span>|</span>
                    <a href="https://git.exyon.ee/exyone/Rssary" target="_blank" class="text-decoration-none">{{ t('footer.source') }}</a>
                </div>
                <div>{{ t('footer.builtWith') }}</div>
            </div>
        </footer>
    </div>

    <div id="body-end-injection"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4"></script>
    <script src="/main.js"></script>
</body>
</html>
